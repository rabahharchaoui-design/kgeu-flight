name = "pfs-scores"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "pfs-scores"
database_id = "8309ccd1-9fea-4b56-818b-ef6717a352a5"

# Secrets, set with `npx wrangler secret put <NAME>` (never in this file):
#   PEPPER          hashes device keys and recovery codes
#   TOKEN_SECRET    signs run tokens
#   OHRABAH_SECRET  unlocks the reserved OHRABAH callsign
